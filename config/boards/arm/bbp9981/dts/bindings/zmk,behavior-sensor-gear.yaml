description: Sensor gear behavior

compatible: "zmk,behavior-sensor-gear"

properties:
  "#binding-cells":
    type: int
    required: true
    const: 1
  label:
    type: string
    required: false
  gear-type:
    type: string
    required: true
    enum:
      - mouse
      - scroll
  min-gear:
    type: int
    required: true
  max-gear:
    type: int
    required: true

binding-cells:
  - gear
