description: |
  ZMK custom behavior for setting A320 touchpad mouse gear or scroll gear.
  Accepts one integer parameter.

  Example usage in keymap:
    &mgear 5   — set mouse gear to 5
    &sgear 3   — set scroll gear to 3

compatible: "zmk,behavior-sensor-gear"

include: one-cell.yaml

properties:
  label:
    type: string
    required: true
